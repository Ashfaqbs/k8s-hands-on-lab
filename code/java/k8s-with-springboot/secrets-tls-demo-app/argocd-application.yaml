apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: file:///mnt/host-repo
    targetRevision: main
    path: helm/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
