{{- if not .Values.vault.enabled }}
# Plain K8s Secret path — used when vault.enabled is false.
# When vault.enabled is true, externalsecret.yaml creates this same
# secret name instead, sourced from Vault.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "demo-app.fullname" . }}-db-creds
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_HOST: {{ printf "%s-postgres" (include "demo-app.fullname" .) | quote }}
  DB_PORT: {{ .Values.appSecret.dbPort | quote }}
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USERNAME: {{ .Values.postgres.username | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
{{- end }}
