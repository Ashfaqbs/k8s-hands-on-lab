{{- if and .Values.vault.enabled .Values.vault.createSecretStore }}
# Cluster-scoped, so normally installed once per cluster by platform
# tooling (not per-app) -- included here as a template purely so you
# can see/learn the wiring. On a real platform this usually already
# exists in-cluster, and app charts just reference it by name via
# vault.createSecretStore: false.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.vault.secretStoreName }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.address }}
      path: {{ .Values.vault.kvPath }}
      version: {{ .Values.vault.kvVersion }}
      auth:
        tokenSecretRef:
          name: {{ .Values.vault.tokenSecretName }}
          key: token
          namespace: {{ .Release.Namespace }}
{{- end }}
