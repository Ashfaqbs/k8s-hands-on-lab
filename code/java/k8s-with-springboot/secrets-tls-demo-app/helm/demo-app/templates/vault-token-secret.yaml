{{- if and .Values.vault.enabled .Values.vault.createSecretStore }}
# Holds the token ESO uses to authenticate to Vault's dev server.
# Local/learning only -- a real Vault would use Kubernetes auth
# (ServiceAccount JWT) instead of a static root/dev token.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vault.tokenSecretName }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.vault.token | quote }}
{{- end }}
