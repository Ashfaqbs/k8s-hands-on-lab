{{- if .Values.vault.enabled }}
# ExternalSecret pulls from Vault -> creates the K8s Secret the
# deployment's envFrom references (same secret name as secret.yaml
# would have created, so deployment.yaml doesn't need to change
# depending on whether vault.enabled is true or false).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "demo-app.fullname" . }}-external-secret
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Values.vault.secretStoreName }}
    kind: {{ .Values.vault.secretStoreKind }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  target:
    name: {{ include "demo-app.fullname" . }}-db-creds
  dataFrom:
    - extract:
        key: {{ .Values.vault.secretPath }}
{{- end }}
