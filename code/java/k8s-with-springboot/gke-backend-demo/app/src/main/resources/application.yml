spring:
  application:
    name: gke-backend-demo
  datasource:
    # 127.0.0.1 because the Cloud SQL Auth Proxy runs as a sidecar in the same pod
    # and exposes the database on localhost -- the app never talks to Cloud SQL directly.
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:gkedemo}
    username: ${DB_USERNAME:gkedemo}
    # Left blank on purpose when the proxy runs with --auto-iam-authn: it authenticates
    # to Cloud SQL using the pod's IAM identity and ignores whatever password is sent here.
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
