# Two containers per pod:
#   app             - the Spring Boot backend, talking to Postgres on 127.0.0.1
#   cloud-sql-proxy - Cloud SQL Auth Proxy sidecar. It authenticates to the Cloud SQL
#                     Admin API using the pod's Workload Identity, opens an encrypted
#                     tunnel to the instance, and exposes it on localhost:5432.
#                     The app never sees a Cloud SQL IP, a CA cert, or (with
#                     --auto-iam-authn) even a real DB password.
#
# Three different ways an env var reaches this pod, side by side (see
# ../gke-specific-features.md for the full comparison):
#   DB_HOST / DB_PORT / DB_NAME  - plain, non-sensitive, written directly below
#   DB_USERNAME + the proxy      - zero secret material at all (IAM DB auth)
#   EXTERNAL_API_KEY             - a real secret that has no IAM-auth shortcut,
#                                   synced from Secret Manager by the CSI volume
#                                   below into a native Secret, then read via envFrom
#
# resources.requests/limits are set on every container because GKE Autopilot rejects
# any pod that doesn't declare them -- on GKE Standard they're "should", on Autopilot
# they're "must".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-backend-demo
  namespace: gke-demo-ns
  labels:
    app.kubernetes.io/name: gke-backend-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-backend-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-backend-demo
    spec:
      serviceAccountName: gke-backend-demo
      containers:
        - name: app
          image: REGION-docker.pkg.dev/PROJECT_ID/gke-backend-demo/gke-backend-demo:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "gkedemo"
            - name: DB_USERNAME
              # IAM DB auth username: the GSA email with the .gserviceaccount.com suffix
              # stripped off, per Cloud SQL's IAM auth username rules.
              value: "gke-backend-demo@PROJECT_ID.iam"
          envFrom:
            # Populated by the Secret Manager CSI driver's secretObjects sync --
            # see 09-secretproviderclass.yaml. The app just sees a normal env var.
            - secretRef:
                name: gke-backend-demo-api-key-secret
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            # Not strictly needed once secretObjects has synced the value into the
            # env var above -- mounted here too so you can see the raw file the CSI
            # driver actually writes (kubectl exec in and `cat` it).
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "PROJECT_ID:REGION:gke-backend-demo-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.gke.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gke-backend-demo-secrets
