# kubernetes.io/ingress.class: "gce" (or, on newer GKE, ingressClassName: gce) tells
# GKE to provision an actual Google Cloud external HTTP(S) Load Balancer for this
# Ingress -- a real L7 GCLB resource outside the cluster, not an in-cluster nginx pod.
# That's the single biggest conceptual difference from the nginx-ingress-on-minikube
# setup in ../../secrets-tls-demo-app: there, the ingress controller is a pod you
# manage; here, it's a managed GCP resource GKE creates and wires up on your behalf.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gke-backend-demo
  namespace: gke-demo-ns
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "gke-backend-demo-ip"
    networking.gke.io/managed-certificates: "gke-backend-demo-cert"
    networking.gke.io/v1beta1.FrontendConfig: "gke-backend-demo-frontendconfig"
spec:
  defaultBackend:
    service:
      name: gke-backend-demo
      port:
        number: 80
