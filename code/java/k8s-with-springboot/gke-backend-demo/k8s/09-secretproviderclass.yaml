# GKE's own answer to "how do secrets get into env vars" for anything that -- unlike
# the DB password -- has no IAM-auth shortcut. This is the GKE Secret Manager add-on:
# no separate CSI driver Helm install, no provider plugin to manage. You enable it
# once per cluster:
#
#   gcloud container clusters update gke-backend-demo --location=REGION \
#     --enable-secret-manager
#
# ...then every pod can mount secrets straight from Secret Manager by referencing a
# SecretProviderClass like this one, authenticated via the pod's own Workload
# Identity (the same ServiceAccount from 01-serviceaccount.yaml -- no separate
# credential to create for this).
#
# secretObjects makes the CSI driver do double duty: it both mounts the secret as a
# file at /mnt/secrets/api-key (see the app container's volumeMount in
# 02-deployment.yaml) AND materializes it as a real Kubernetes Secret object, so it
# can also be consumed the boring, familiar way via envFrom.secretRef -- no code
# changes needed to go from "reads a file" to "reads an env var".
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gke-backend-demo-secrets
  namespace: gke-demo-ns
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/gke-backend-demo-external-api-key/versions/latest"
        path: "api-key"
  secretObjects:
    - secretName: gke-backend-demo-api-key-secret
      type: Opaque
      data:
        - objectName: api-key
          key: EXTERNAL_API_KEY
