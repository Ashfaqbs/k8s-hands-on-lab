# Kubernetes ServiceAccount (KSA) bound to a Google Cloud IAM Service Account (GSA)
# via Workload Identity. No JSON key file, no static credential anywhere -- GKE's
# metadata server hands the pod short-lived GCP credentials scoped to whatever IAM
# roles the GSA below actually has (here: roles/cloudsql.client).
#
# The binding itself is created outside this file, with gcloud (see ../README.md step 6):
#   gcloud iam service-accounts add-iam-policy-binding \
#     gke-backend-demo@PROJECT_ID.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:PROJECT_ID.svc.id.goog[gke-demo-ns/gke-backend-demo]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gke-backend-demo
  namespace: gke-demo-ns
  annotations:
    iam.gke.io/gcp-service-account: gke-backend-demo@PROJECT_ID.iam.gserviceaccount.com
