      app: api2
  template:
    metadata:
      labels:
        app: api2
    spec:
      containers:
      - name: springboot-api
        image: darksharkash/simplerestapisb-k8s
        ports:
        - containerPort: 8080

---        
#API 2 Service
apiVersion: v1
