# API 1 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api1-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api1
  template:
    metadata:
      labels:
        app: api1
    spec:
      containers:
      - name: springboot-api
        image: darksharkash/simplerestapisb-k8s
        ports:
        - containerPort: 8080
---       
#API 1 Service
apiVersion: v1
kind: Service
metadata:
  name: api1-service
  namespace: default
spec:
  selector:
    app: api1
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
--- 
#API 2 Deployment
apiVersion: apps/v1
