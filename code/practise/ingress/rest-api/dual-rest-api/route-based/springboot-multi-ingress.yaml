# Error
#What’s Happening
# Your Setup: 
# Ingress routes /api1 to api1-service:80 → pod’s 8080.

# You’re calling http://springboot.local/api1/helloworld.

# Error: 404 Not Found with path: "/api1/helloworld".

# Clue: You said your API works at localhost:8080/helloworld locally, but now it’s failing with /api1/helloworld.

# Why the 404?
# Spring Boot Endpoint: Your app (darksharkash/simplerestapisb-k8s) has an endpoint at /helloworld, not /api1/helloworld. When NGINX forwards the full path (/api1/helloworld) to the pod, Spring Boot doesn’t have a controller mapped to that—it’s expecting just /helloworld.

# Ingress Path Behavior: By default, NGINX passes the entire request path (including /api1) to the backend (your pod). Since your app doesn’t know /api1/helloworld, it 404s.




