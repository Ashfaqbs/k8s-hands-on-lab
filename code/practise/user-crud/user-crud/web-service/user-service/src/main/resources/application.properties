spring.application.name=user-service




# Database Configuration
# spring.datasource.url=jdbc:postgresql://localhost:9991/mainschema
# spring.datasource.username=postgres
# spring.datasource.password=admin

# Dynamic env values but no defaults
# spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAME}?useSSL=false
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# now we run the jar without any env variables it will run fine as we have provided defaults
# C:\tmp\full-stack\user-crud\web-service\user-service\target>java -jar user-webservice-pg.jar      


# better as we have provided defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9991/mainschema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}



# Hibernate Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


